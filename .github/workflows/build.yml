name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Test
        run: dotnet test -c Release --nologo --no-build

      - name: Publish
        run: |
          dotnet publish src/EsCli -c Release -o out/es-cli --nologo
          dotnet publish src/EsMcp -c Release -o out/es-mcp --nologo

      - uses: actions/upload-artifact@v4
        with:
          name: es-tools-win-x64
          path: out
